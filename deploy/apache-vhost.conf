# Apache 2.4 VirtualHost configuration for 机场测评 (jichangceping.biz)
# Adjust DocumentRoot and SSLCertificate* paths to match your production server.

<VirtualHost *:80>
    ServerName jichangceping.biz
    ServerAlias www.jichangceping.biz

    DocumentRoot /var/www/jichangceping.biz/dist

    RewriteEngine On
    RewriteRule ^ https://jichangceping.biz%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/jichangceping-http-error.log
    CustomLog ${APACHE_LOG_DIR}/jichangceping-http-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName jichangceping.biz
    ServerAlias www.jichangceping.biz

    DocumentRoot /var/www/jichangceping.biz/dist
    DirectoryIndex index.html
    ErrorDocument 404 /404.html

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/jichangceping.biz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jichangceping.biz/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off

    # Canonical non-www redirect over HTTPS
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.jichangceping\.biz$ [NC]
    RewriteRule ^ https://jichangceping.biz%{REQUEST_URI} [R=301,L]

    <Directory /var/www/jichangceping.biz/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Ensure search engine crawlers (Googlebot, bingbot, Baiduspider, yisouspider) have unrestricted read access
    <FilesMatch "^(robots\.txt|sitemap\.xml|llms\.txt|rss\.xml)$">
        Require all granted
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/jichangceping-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/jichangceping-ssl-access.log combined
</VirtualHost>
</IfModule>
