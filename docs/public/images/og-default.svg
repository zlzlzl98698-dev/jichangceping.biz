      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="60%" stop-color="#131d31" />
      <stop offset="100%" stop-color="#0f2947" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
